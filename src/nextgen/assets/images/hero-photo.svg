<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="p1" x1="0" x2="1">
      <stop offset="0%" stop-color="#091421"/>
      <stop offset="50%" stop-color="#15202b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="flare2" cx="35%" cy="25%">
      <stop offset="0%" stop-color="#ffdd99" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#ffdd99" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffdd99" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#p1)"/>

  <!-- layered shapes to simulate a cinematic photo depth -->
  <g opacity="0.95">
    <g transform="translate(-120,-80) scale(1.03)">
      <rect x="0" y="420" width="1600" height="480" rx="0" fill="#07141d" opacity="0.25"/>
      <path d="M0 380 C260 300 520 520 840 480 C1160 440 1420 320 1600 360 L1600 900 L0 900 Z" fill="#0e1f2a" opacity="0.5" />
      <path d="M0 460 C220 360 400 540 760 500 C1180 460 1420 380 1600 460 L1600 900 L0 900 Z" fill="#12262f" opacity="0.35" />
    </g>
  </g>

  <!-- cinematic warm flare -->
  <ellipse cx="460" cy="180" rx="540" ry="220" fill="url(#flare2)" transform="rotate(-10 460 180)" />

  <!-- texture / grain -->
  <g fill="#ffffff" opacity="0.03">
    <circle cx="1180" cy="96" r="1.6" />
    <circle cx="1320" cy="160" r="1.1" />
    <circle cx="1460" cy="74" r="1.4" />
    <circle cx="920" cy="132" r="1.0" />
  </g>
</svg>